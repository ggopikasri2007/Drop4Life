<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup | Drop4Life</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/singup.css">
</head>

<body>

<header>
  <div class="container ">
    <h1 class="logo">Drop4Life</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="find_donors.html">Find Donors</a>
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>

<section class="signup-section">
  <div class="signup-card">
    <h2>Create Donor Account</h2>

    <!-- ✅ Important change here -->
    <form id="signupForm">

      <input type="text" name="fullname" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Create Password" required>
      <input type="number" name="age" placeholder="Age" min="18" required>

      <select name="bloodgroup" required>
        <option value="">Select Blood Group</option>
        <option>O+</option><option>O−</option>
        <option>A+</option><option>A−</option>
        <option>B+</option><option>B−</option>
        <option>AB+</option><option>AB−</option>
      </select>

      <input type="text" name="city" placeholder="City" required>
      <input type="tel" name="phone" placeholder="Phone Number" required>

      <button type="submit">Signup</button>
    </form>

    <p class="login-text">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>
</section>

<footer>
  <p>© 2025 Drop4Life | All Rights Reserved</p>
</footer>

<!-- ✅ JS File Link -->
<script src="../js/signup.js"></script>

</body>
</html>
